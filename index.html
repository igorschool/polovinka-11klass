<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Половинка · 11 класс</title>
  <meta name="description" content="Игра: гаметогенез, мейоз, конвейер сперматогенеза и ооцит, который ждал с рождения." />
  <style>
    :root {
      --navy: #0B3D4A; --teal: #1A6B7A; --gold: #C4A035; --cream: #F6F1E6;
      --sky: #E8F3F6; --dark: #14323A; --rose: #B42318; --green: #1F7A3A;
      --purple: #5E35B1; --line: #C5D5D8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
      background: radial-gradient(1200px 700px at 10% -10%, #1a6b7a 0%, var(--navy) 45%, #071f26 100%);
      color: var(--dark);
    }
    #app { max-width: 920px; margin: 0 auto; padding: 16px 14px 40px; }
    .screen { display: none; animation: rise .35s ease; }
    .screen.on { display: block; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .top { display: flex; justify-content: space-between; align-items: center; color: #d7e3dc; font-size: 13px; margin-bottom: 12px; gap: 8px; }
    .badge { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); padding: 6px 10px; border-radius: 999px; color: #fff; }
    .badge b { color: var(--gold); }
    .card { background: var(--cream); border-radius: 22px; padding: 22px 20px 20px; box-shadow: 0 16px 40px rgba(0,0,0,.28); }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 38px); color: var(--navy); line-height: 1.15; }
    h2 { margin: 0 0 10px; font-size: 22px; color: var(--navy); }
    p { margin: 0 0 12px; line-height: 1.5; }
    .kicker { color: #8a6d16; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; margin-bottom: 8px; }
    .lead { font-size: 16px; color: #355056; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      appearance: none; border: 0; cursor: pointer; font-family: inherit;
      background: var(--navy); color: #fff; font-weight: 800;
      padding: 13px 16px; border-radius: 14px; font-size: 16px;
    }
    button:active { transform: scale(.98); }
    button.gold { background: var(--gold); color: #2b2208; }
    button.ghost { background: #fff; color: var(--navy); border: 2px solid var(--line); }
    button.green { background: var(--green); }
    button.rose { background: var(--rose); }
    button:disabled { opacity: .45; cursor: default; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
    .lab-card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; width: 100%; color: var(--navy); }
    .lab-card small { display: block; color: #5b6d71; font-weight: 700; margin-bottom: 4px; }
    .hint, .ok, .bad {
      border-radius: 10px; padding: 10px 12px; margin: 12px 0; font-weight: 700;
    }
    .hint { background: var(--sky); border-left: 5px solid var(--teal); }
    .ok { background: #e7f6ea; border-left: 5px solid var(--green); }
    .bad { background: #fdecea; border-left: 5px solid var(--rose); }
    .arena {
      background: #fff; border: 2px dashed var(--line); border-radius: 18px;
      padding: 14px; margin: 12px 0;
    }
    .choices { display: grid; gap: 8px; }
    .choices button { text-align: left; background: #fff; color: var(--dark); border: 2px solid var(--line); }
    .choices button.right { background: #e7f6ea; border-color: var(--green); }
    .choices button.wrong { background: #fdecea; border-color: var(--rose); }
    .formula {
      font-weight: 800; text-align: center; background: #fff; border-radius: 12px;
      padding: 10px; margin: 10px 0; color: var(--navy);
    }
    .foot { margin-top: 14px; color: #9bb0b5; font-size: 12px; text-align: center; }
    .tiny { font-size: 13px; color: #4d6469; }
    .stars { font-size: 22px; letter-spacing: 2px; }
    input[type=text] {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
      font-size: 16px; font-family: inherit; margin: 8px 0 14px;
    }
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
    .path { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
    .chip {
      background: var(--sky); border: 2px solid var(--line); border-radius: 999px;
      padding: 6px 10px; font-weight: 800; font-size: 13px; color: var(--navy);
    }
    .chip.on { background: var(--navy); color: #fff; border-color: var(--gold); }
    .chip.done { background: #e7f6ea; border-color: var(--green); }
    .cell {
      width: 92px; height: 92px; margin: 8px auto; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #8fd4cc, #1A6B7A);
      box-shadow: inset -8px -10px 0 rgba(0,0,0,.12);
      position: relative;
    }
    .cell::after {
      content: ""; position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%);
      width: 28px; height: 28px; border-radius: 50%; background: #5E35B1;
    }
    .cell.n23 { background: radial-gradient(circle at 30% 30%, #9ec7e6, #2a6f96); }
    .cell.egg {
      width: 120px; height: 120px;
      background: radial-gradient(circle at 35% 30%, #ffe2b0, #e8a15a);
      box-shadow: 0 0 0 8px rgba(196,160,53,.35);
    }
    .cell.polar {
      width: 44px; height: 44px;
      background: radial-gradient(circle at 30% 30%, #f3d0c8, #B42318);
    }
    .pair { display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 140px; }
    .nlabel { text-align: center; font-weight: 800; color: var(--navy); }
    .sperm {
      width: 22px; height: 30px; margin: 20px auto 40px; border-radius: 50% 50% 40% 40%;
      background: #2a6f96; position: relative;
    }
    .sperm::after {
      content: ""; position: absolute; left: 9px; top: 28px; width: 3px; height: 46px;
      background: var(--teal); transform: rotate(18deg); border-radius: 2px;
    }
    .clock {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0;
    }
    .tick { background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; font-size: 12px; font-weight: 800; color: var(--navy); }
    .tick.on { border-color: var(--gold); background: #fff6d8; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .compare div { background: #fff; border-radius: 12px; padding: 10px; border: 2px solid var(--line); font-size: 14px; }
    .compare .c { border-color: var(--green); }
    .compare .n { border-color: var(--gold); }
  </style>
</head>
<body>
  <div id="app">
    <div class="top">
      <div class="badge">11 класс · биология</div>
      <div class="badge">баллы: <b id="score">0</b></div>
    </div>
    <div id="screens"></div>
    <p class="foot">Половинка · Балгабекова А. М. · цель 11.2.1.1</p>
  </div>
  <div class="confetti" id="confetti"></div>
<script>
const $ = (sel, root=document) => root.querySelector(sel);
const state = { score: 0, name: "", pipe: 0, wait: 0, quiz: 0, bonus: false };

const PIPE = [
  { name: "Сперматогоний", n: "46", cls: "",
    ask: "С чего начинается конвейер? Эта клетка ещё диплоидная и умеет митоз — чтобы запас не кончился.",
    options: ["Сперматогоний", "Сперматозоид", "Полярное тельце", "Ооцит II"],
    i: 0, hint: "Стволовая клетка линии. 2n = 46." },
  { name: "Сперматоцит I", n: "46", cls: "",
    ask: "Запас есть. Какая клетка входит в мейоз I?",
    options: ["Сперматоцит I", "Сперматида", "Яйцеклетка", "Оогоний"],
    i: 0, hint: "Первичный сперматоцит ещё с набором 46." },
  { name: "Сперматоцит II", n: "23", cls: "n23",
    ask: "Мейоз I прошёл. Набор уже гаплоидный. Как называется клетка?",
    options: ["Сперматоцит II", "Сперматогоний", "Зигота", "Ооцит I"],
    i: 0, hint: "После мейоза I набор n = 23." },
  { name: "Сперматозоид", n: "23", cls: "n23",
    ask: "Сперматида выбрасывает цитоплазму и растит хвост. Кто на выходе?",
    options: ["Сперматозоид", "Ооцит I", "Сперматогоний", "Полярное тельце"],
    i: 0, hint: "Готовая гамета. Мало цитоплазмы, набор 23." }
];

const WAIT = [
  { title: "Ещё до рождения",
    ask: "Что делает будущая яйцеклетка в организме матери?",
    a: ["Оогоний → ооцит I и стоп в профазе I", "Сразу четыре одинаковые яйцеклетки", "Ждёт сперматогенез отца"],
    i: 0, hint: "Мейоз начинается рано и ставится на паузу." },
  { title: "От рождения до овуляции",
    ask: "Что происходит с ооцитом I эти годы?",
    a: ["Ждёт в профазе I, набор всё ещё 46", "Каждый месяц проходит мейоз II", "Делится на четыре сперматозоида"],
    i: 0, hint: "Это и есть «клетка, которая ждала с рождения»." },
  { title: "Овуляция",
    ask: "Чем заканчивается мейоз I?",
    a: ["Ооцит II и первое полярное тельце", "Четыре яйцеклетки поровну", "Зигота 46 хромосом"],
    i: 0, hint: "Цитоплазма почти вся у большой клетки." },
  { title: "Если встретился сперматозоид",
    ask: "Что доделывается в этот момент?",
    a: ["Мейоз II: яйцеклетка 23 и второе полярное тельце", "Митоз кожи", "Ничего: набор уже 46 внутри яйцеклетки"],
    i: 0, hint: "Второй набор 23 приносит сперматозоид. Яйцеклетка сама тоже должна стать 23." }
];

const QUIZ = [
  { q: "Зачем гаметогенезу мейоз?", a: ["чтобы из 46 получить 23 и после встречи снова было 46", "чтобы клетка стала больше", "чтобы убрать митохондрии"], i: 0 },
  { q: "Сперматогенез из одного сперматоцита I даёт…", a: ["четыре сперматозоида", "одну яйцеклетку", "две зиготы"], i: 0 },
  { q: "Полярное тельце нужно, чтобы…", a: ["унести лишние хромосомы и отдать цитоплазму ооциту", "плавать быстрее сперматозоида", "заменить ядро"], i: 0 },
  { q: "Ооцит I ставит мейоз на паузу…", a: ["ещё до рождения, в профазе I", "только в старости", "после оплодотворения"], i: 0 },
  { q: "Что общего у готового сперматозоида и яйцеклетки?", a: ["гаплоидный набор n = 23", "одинаковый размер", "одинаково много цитоплазмы"], i: 0 },
  { q: "Фон Бэр в 1827 году показал, что…", a: ["яйцеклетка млекопитающего — это клетка, а не человечек в сперматозоиде", "мейоз придумали в XX веке", "у человека 92 хромосомы"], i: 0 }
];

function addScore(n){ state.score += n; $("#score").textContent = state.score; }
function beep(ok=true){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sine"; o.frequency.value = ok ? 660 : 180; g.gain.value = .05;
    o.connect(g); g.connect(ctx.destination); o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, 140);
  } catch(_){}
}
function burst(){
  const box = $("#confetti"); box.innerHTML = "";
  for (let i=0;i<28;i++){
    const d = document.createElement("div");
    d.style.cssText = `position:absolute;left:${Math.random()*100}%;top:-10px;width:8px;height:12px;background:${["#C4A035","#1A6B7A","#E8B923","#fff"][i%4]};border-radius:2px;animation:fall ${1+Math.random()}s linear forwards`;
    box.appendChild(d);
  }
  if (!$("#fallstyle")) {
    const s = document.createElement("style");
    s.id = "fallstyle";
    s.textContent = "@keyframes fall{to{transform:translateY(110vh) rotate(240deg);opacity:0}}";
    document.head.appendChild(s);
  }
  setTimeout(() => box.innerHTML = "", 1400);
}

function go(name){
  const map = { home, how, konveier, after1, ozhidanie, cyto, quiz, diploma };
  $("#screens").innerHTML = `<section class="screen on card">${map[name]()}</section>`;
  bind(name);
  history.replaceState(null, "", location.pathname + location.search + "#" + name);
}

function home(){
  return `
    <div class="kicker">игра к статье</div>
    <h1>Половинка</h1>
    <p class="lead">Как из клетки с <b>46</b> хромосомами получается гамета с <b>23</b>? Сначала конвейер сперматогенеза. Потом — ооцит, который ждал с рождения.</p>
    <label class="tiny">Как тебя зовут?</label>
    <input id="nm" type="text" maxlength="24" placeholder="имя" value="${state.name}" />
    <div class="grid2">
      <button class="lab-card" data-go="how"><small>полный путь</small><b>Две лаборатории</b><p class="tiny">мейоз → оогенез</p></button>
      <button class="lab-card" data-go="konveier"><small>QR 1</small><b>Лаборатория «Конвейер»</b></button>
      <button class="lab-card" data-go="ozhidanie"><small>QR 2</small><b>Лаборатория «Ожидание»</b></button>
      <button class="lab-card" data-go="quiz"><small>финал</small><b>Сравнение и диплом</b></button>
    </div>`;
}
function how(){
  return `
    <div class="kicker">как играть</div>
    <h2>Правила</h2>
    <p>1. Собери конвейер: сперматогоний → сперматоцит I → сперматоцит II → сперматозоид.</p>
    <p>2. Во второй лаборатории проведи ооцит по времени: до рождения, ожидание, овуляция, встреча.</p>
    <p>3. Цитоплазму отдай большой клетке, не полярному тельцу.</p>
    <div class="hint">Урок про клетки и хромосомы. 23 + 23 = 46.</div>
    <button class="gold" data-go="konveier">Начать с конвейера</button>
    <button class="ghost" data-go="home">Назад</button>`;
}
function konveier(){
  const i = state.pipe;
  if (i >= PIPE.length) {
    return `
      <div class="kicker">лаборатория 1 · бонус</div>
      <h2>Сколько сперматозоидов?</h2>
      <p>Из <b>одного сперматоцита I</b> после двух делений мейоза получается…</p>
      <div class="choices" id="bonus">
        <button data-i="4">четыре сперматозоида</button>
        <button data-i="1">одна яйцеклетка</button>
        <button data-i="2">два сперматогония</button>
      </div>
      <div id="msg" class="hint">Считай клетки после мейоза I и мейоза II.</div>`;
  }
  const r = PIPE[i];
  const chips = PIPE.map((s, idx) => `<span class="chip ${idx<i?"done":idx===i?"on":""}">${idx+1}. ${s.name}</span>`).join("");
  const vis = r.name === "Сперматозоид"
    ? `<div class="sperm"></div><p class="nlabel">n = ${r.n}</p>`
    : `<div class="cell ${r.cls}"></div><p class="nlabel">набор ${r.n}</p>`;
  return `
    <div class="kicker">лаборатория 1 · шаг ${i+1}/4</div>
    <h2>${r.ask}</h2>
    <div class="path">${chips}</div>
    <div class="arena">${vis}</div>
    <div class="choices" id="opts">${r.options.map((t,idx)=>`<button data-i="${idx}">${t}</button>`).join("")}</div>
    <div id="msg" class="hint">${r.hint}</div>`;
}
function after1(){
  return `
    <div class="kicker">мост</div>
    <h2>Половинка готова</h2>
    <p class="formula">2n = 46 → мейоз → n = 23<br/>сперматогенез: 1 сперматоцит I → 4 сперматозоида</p>
    <p>Мужской конвейер делает много маленьких клеток. Женский путь делает <b>одну большую</b> и ставит мейоз на паузу.</p>
    <div class="ok">Цель 11.2.1.1: схема гаметогенеза — это путь от 46 к 23.</div>
    <button class="gold" data-go="ozhidanie">Лаборатория «Ожидание»</button>
    <button class="ghost" data-go="home">В меню</button>`;
}
function ozhidanie(){
  const i = state.wait;
  const r = WAIT[i];
  const ticks = ["До рождения","Детство","Овуляция","Встреча"].map((t,idx)=>
    `<div class="tick ${idx===i?"on":idx<i?"on":""}">${t}</div>`).join("");
  const vis = i === 0 || i === 1
    ? `<div class="cell egg"></div><p class="nlabel">ооцит I · набор 46 · пауза</p>`
    : i === 2
      ? `<div class="pair"><div><div class="cell egg"></div><p class="nlabel">ооцит II</p></div><div><div class="cell polar"></div><p class="nlabel">тельце</p></div></div>`
      : `<div class="pair"><div class="sperm"></div><div class="cell egg"></div></div><p class="nlabel">23 + 23 → потом 46</p>`;
  return `
    <div class="kicker">лаборатория 2 · станция ${i+1}/4</div>
    <h2>${r.title}</h2>
    <div class="clock">${ticks}</div>
    <div class="arena">${vis}</div>
    <p>${r.ask}</p>
    <div class="choices" id="opts">${r.a.map((t,idx)=>`<button data-i="${idx}">${t}</button>`).join("")}</div>
    <div id="msg" class="hint">${r.hint}</div>`;
}
function cyto(){
  return `
    <div class="kicker">лаборатория 2 · цитоплазма</div>
    <h2>Кто забирает запас?</h2>
    <p>После мейоза I две клетки. Кому нужна «кладовая», чтобы потом питать зародыш?</p>
    <div class="grid2">
      <button class="lab-card" data-cyto="egg"><div class="cell egg"></div><b>Ооцит II</b><p class="tiny">большая клетка</p></button>
      <button class="lab-card" data-cyto="polar"><div class="cell polar"></div><b>Полярное тельце</b><p class="tiny">маленькая клетка</p></button>
    </div>
    <div id="msg" class="hint">Полярное тельце уносит лишние хромосомы. Еду оно не копит.</div>`;
}
function quiz(){
  const i = state.quiz;
  if (i >= QUIZ.length) {
    return `
      <div class="kicker">сравнение</div>
      <h2>Таблица в голове</h2>
      <div class="compare">
        <div class="c"><b>Сперматогенез</b><br/>с пубертата<br/>четыре гаметы<br/>мало цитоплазмы<br/>почти без паузы</div>
        <div class="n"><b>Оогенез</b><br/>ещё до рождения<br/>одна яйцеклетка<br/>кладовая у большой<br/>годы в профазе I</div>
      </div>
      <p class="formula">Общее: мейоз. Обе гаметы — n = 23.</p>
      <button class="gold" data-go="diploma">Диплом</button>`;
  }
  const item = QUIZ[i];
  return `
    <div class="kicker">вопрос ${i+1}/${QUIZ.length}</div>
    <h2>${item.q}</h2>
    <div class="choices" id="qz">${item.a.map((t,idx)=>`<button data-i="${idx}">${t}</button>`).join("")}</div>
    <div id="msg"></div>`;
}
function diploma(){
  const s = state.score;
  const stars = s >= 80 ? "★★★★★" : s >= 50 ? "★★★★☆" : "★★★☆☆";
  const who = state.name || "исследователь";
  return `
    <div class="kicker">готово</div>
    <h1>Диплом</h1>
    <p class="stars">${stars}</p>
    <p><b>${who}</b> читает схему гаметогенеза: от 46 к 23 и снова к 46.</p>
    <p class="formula">${s} баллов</p>
    <div class="ok">Цепочка: мейоз → конвейер сперматозоидов → ооцит с паузой → полярное тельце → 23+23.</div>
    <button class="gold" data-go="home">Ещё раз</button>`;
}

function bind(name){
  $("#screens").querySelectorAll("[data-go]").forEach(b => {
    b.onclick = () => {
      if (name==="home") state.name = ($("#nm") && $("#nm").value.trim()) || state.name;
      go(b.dataset.go);
    };
  });
  if (name==="konveier" && state.pipe < PIPE.length){
    const item = PIPE[state.pipe];
    $("#opts").onclick = (e) => {
      const btn = e.target.closest("button");
      if (!btn || btn.disabled) return;
      const ok = Number(btn.dataset.i) === item.i;
      const msg = $("#msg");
      if (ok) {
        [...$("#opts").children].forEach((b, idx) => {
          b.disabled = true;
          if (idx === item.i) b.classList.add("right");
        });
        addScore(12); beep(true); burst();
        msg.className = "ok";
        msg.textContent = "Верно. " + item.name + ", набор " + item.n + ".";
        setTimeout(() => { state.pipe += 1; go("konveier"); }, 900);
      } else {
        btn.classList.add("wrong"); beep(false);
        msg.className = "bad";
        msg.textContent = "Не тот шаг. Смотри конвейер: стволовая → мейоз I → мейоз II → хвост.";
        setTimeout(() => { btn.classList.remove("wrong"); }, 700);
      }
    };
  }
  if (name==="konveier" && state.pipe >= PIPE.length){
    $("#bonus").onclick = (e) => {
      const btn = e.target.closest("button");
      if (!btn || btn.disabled) return;
      const ok = btn.dataset.i === "4";
      [...$("#bonus").children].forEach(b => b.disabled = true);
      if (ok) { btn.classList.add("right"); addScore(10); beep(true); burst(); }
      else { btn.classList.add("wrong"); beep(false); }
      $("#msg").className = ok ? "ok" : "bad";
      $("#msg").textContent = ok ? "Да. Два деления мейоза: 1 → 2 → 4." : "Мейоз режет дважды. Из одной клетки — четыре.";
      setTimeout(() => go("after1"), 1000);
    };
  }
  if (name==="ozhidanie"){
    const item = WAIT[state.wait];
    $("#opts").onclick = (e) => {
      const btn = e.target.closest("button");
      if (!btn || btn.disabled) return;
      const ok = Number(btn.dataset.i) === item.i;
      const msg = $("#msg");
      if (ok) {
        [...$("#opts").children].forEach((b, idx) => {
          b.disabled = true;
          if (idx === item.i) b.classList.add("right");
        });
        addScore(12); beep(true); burst();
        msg.className = "ok"; msg.textContent = "Так.";
        setTimeout(() => {
          state.wait += 1;
          if (state.wait >= WAIT.length) go("cyto");
          else go("ozhidanie");
        }, 900);
      } else {
        btn.classList.add("wrong"); beep(false);
        msg.className = "bad";
        msg.textContent = "Сверься с линией времени в комиксе.";
        setTimeout(() => { btn.classList.remove("wrong"); }, 700);
      }
    };
  }
  if (name==="cyto"){
    document.querySelectorAll("[data-cyto]").forEach(b => {
      b.onclick = () => {
        const ok = b.dataset.cyto === "egg";
        const msg = $("#msg");
        if (ok) {
          addScore(10); beep(true); burst();
          msg.className = "ok";
          msg.textContent = "Верно. Полярное тельце — не «брак», а способ выбросить лишний набор и оставить кладовую.";
          setTimeout(() => go("quiz"), 1100);
        } else {
          beep(false);
          msg.className = "bad";
          msg.textContent = "Тельце слишком маленькое. Запас еды нужен той клетке, из которой может вырасти человек.";
        }
      };
    });
  }
  if (name==="quiz" && state.quiz < QUIZ.length){
    const item = QUIZ[state.quiz];
    $("#qz").onclick = (e) => {
      const btn = e.target.closest("button");
      if (!btn || btn.disabled) return;
      const ok = Number(btn.dataset.i) === item.i;
      [...$("#qz").children].forEach((b, idx) => {
        b.disabled = true;
        if (idx === item.i) b.classList.add("right");
      });
      if (ok) { btn.classList.add("right"); addScore(8); beep(true); burst(); }
      else { btn.classList.add("wrong"); beep(false); }
      $("#msg").className = ok ? "ok" : "bad";
      $("#msg").textContent = ok ? "Так." : "Сверься с комиксом: 23, мейоз, пауза, фон Бэр.";
      setTimeout(() => { state.quiz += 1; go("quiz"); }, 900);
    };
  }
}

function boot(){
  const h = (location.hash || "").replace("#", "");
  const alias = { konveier: "konveier", ozhidanie: "ozhidanie", lab1: "konveier", lab2: "ozhidanie" };
  const start = alias[h] || (h && {home,how,konveier,after1,ozhidanie,cyto,quiz,diploma}[h] ? h : "home");
  go(start);
}
boot();
</script>
</body>
</html>
